<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 포트폴리오 웹뷰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 flex justify-center items-center p-0 md:p-6 transition-colors duration-200">

  <!-- 웹뷰 프레임 컨테이너 (모바일 프레임 & 데스크톱 확장 가변 모드) -->
  <div id="appContainer" class="w-full max-w-md bg-white dark:bg-slate-800 min-h-screen md:min-h-[844px] md:max-h-[90vh] md:rounded-[36px] md:shadow-2xl overflow-hidden flex flex-col relative border-0 md:border-8 border-slate-200 dark:border-slate-700 transition-all duration-300">
    
    <!-- 모바일 노치 시뮬레이션 (데스크톱 프레임 모드일 때만 표시) -->
    <div class="hidden md:flex justify-center items-center py-1.5 bg-slate-200 dark:bg-slate-700">
      <div class="w-20 h-3 bg-slate-400 dark:bg-slate-600 rounded-full"></div>
    </div>

    <!-- 앱 헤더 -->
    <header class="bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-100 dark:border-slate-700/60 px-4 py-3 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold text-sm shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <div>
          <h1 class="text-sm font-bold tracking-tight text-slate-900 dark:text-white leading-none">Portfolio App</h1>
          <p class="text-[10px] text-slate-400 mt-0.5">상세페이지 포트폴리오</p>
        </div>
      </div>
      <div class="flex items-center space-x-1">
        <!-- 프레임 토글 (모바일 프레임 vs 전체화면) -->
        <button onclick="toggleViewMode()" title="화면 크기 전환" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
          <i id="frameIcon" class="fa-solid fa-expand text-xs"></i>
        </button>
        <!-- 다크모드 토글 -->
        <button onclick="toggleDarkMode()" title="테마 변경" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
          <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
        </button>
        <!-- 새로고침 -->
        <button onclick="fetchPortfolioData()" title="데이터 새로고침" class="w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
          <i class="fa-solid fa-arrows-rotate text-xs"></i>
        </button>
      </div>
    </header>

    <!-- 검색창 -->
    <div class="px-4 pt-3 pb-2 bg-white dark:bg-slate-800">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="filterPortfolios()" placeholder="클라이언트, 제목, 태그 검색..." 
               class="w-full pl-9 pr-4 py-2 bg-slate-100 dark:bg-slate-700/50 border-0 rounded-xl text-xs text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition">
      </div>
    </div>

    <!-- 카테고리 탭 (동적 슬라이드) -->
    <div class="px-4 py-2 bg-white dark:bg-slate-800 border-b border-slate-100 dark:border-slate-700/60 overflow-x-auto no-scrollbar">
      <div id="categoryTabs" class="flex space-x-1.5 whitespace-nowrap text-xs font-medium">
        <button onclick="selectCategory('전체')" class="category-btn active px-3 py-1.5 rounded-xl bg-blue-600 text-white font-semibold transition">전체</button>
      </div>
    </div>

    <!-- 포트폴리오 리스트 메인 영역 -->
    <main class="flex-1 overflow-y-auto p-4 no-scrollbar space-y-3" id="portfolioList">
      <!-- 로딩 상태 -->
      <div id="loadingState" class="text-center py-16 text-slate-400">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
        <p class="text-xs">포트폴리오 데이터를 불러오는 중...</p>
      </div>
    </main>

    <!-- 하단 모바일 내비게이션 바 -->
    <footer class="bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-100 dark:border-slate-700/60 px-6 py-2.5 flex justify-around items-center text-[10px] text-slate-400 sticky bottom-0 z-20">
      <button onclick="switchTab('all')" id="navAll" class="flex flex-col items-center text-blue-600 font-semibold">
        <i class="fa-solid fa-border-all text-base mb-0.5"></i>
        <span>포트폴리오</span>
      </button>
      <button onclick="switchTab('saved')" id="navSaved" class="flex flex-col items-center hover:text-slate-600 dark:hover:text-slate-200 transition relative">
        <i class="fa-solid fa-bookmark text-base mb-0.5"></i>
        <span>보관함</span>
        <span id="savedBadge" class="hidden absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
      <button onclick="openInquiryModal()" class="flex flex-col items-center hover:text-slate-600 dark:hover:text-slate-200 transition">
        <i class="fa-solid fa-paper-plane text-base mb-0.5"></i>
        <span>의뢰 문의</span>
      </button>
    </footer>

  </div>

  <!-- 상세페이지 모달 레이어 (웹뷰 전용 뷰어) -->
  <div id="detailModal" class="fixed inset-0 bg-black/70 z-50 hidden flex justify-center items-end md:items-center p-0 md:p-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white dark:bg-slate-800 w-full max-w-md h-[92vh] md:h-[85vh] rounded-t-[28px] md:rounded-[28px] flex flex-col overflow-hidden shadow-2xl animate-slide-up">
      <!-- 모달 헤더 -->
      <div class="px-4 py-3.5 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white/90 dark:bg-slate-800/90 backdrop-blur-md sticky top-0 z-10">
        <div class="pr-2 min-w-0">
          <span id="modalCategory" class="text-[10px] bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400 px-2 py-0.5 rounded-md font-bold">카테고리</span>
          <h2 id="modalTitle" class="text-sm font-bold text-slate-900 dark:text-white mt-0.5 truncate leading-snug">제목</h2>
          <p id="modalClient" class="text-[11px] text-slate-400 truncate">클라이언트명</p>
        </div>
        <div class="flex items-center space-x-1 flex-shrink-0">
          <button id="modalBookmarkBtn" onclick="" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
            <i class="fa-regular fa-bookmark text-sm"></i>
          </button>
          <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400 flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-sm"></i>
          </button>
        </div>
      </div>

      <!-- 모달 본문 스크롤 영역 -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar">
        <!-- 기획의도 및 요약 카포 -->
        <div class="bg-slate-50 dark:bg-slate-700/40 p-3.5 rounded-2xl border border-slate-100 dark:border-slate-700 text-xs space-y-2">
          <div>
            <span class="font-bold text-slate-800 dark:text-slate-200">📌 기획 요약</span>
            <p id="modalSummary" class="text-slate-600 dark:text-slate-300 mt-0.5 leading-relaxed">요약 내용</p>
          </div>
          <div id="modalIntentBox" class="hidden pt-2 border-t border-slate-200/60 dark:border-slate-600">
            <span class="font-bold text-slate-800 dark:text-slate-200">🎯 기획 전략</span>
            <p id="modalIntent" class="text-slate-600 dark:text-slate-300 mt-0.5 leading-relaxed">기획 의도</p>
          </div>
          <div id="modalTags" class="flex flex-wrap gap-1 pt-1"></div>
        </div>

        <!-- 상세페이지 연속 이미지 뷰어 -->
        <div class="space-y-1.5">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Detail View</h3>
            <span class="text-[10px] text-blue-500"><i class="fa-solid fa-arrows-up-down text-[9px] mr-1"></i>스크롤하여 전체보기</span>
          </div>
          <div id="modalDetailImages" class="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900">
            <!-- 상세 이미지 삽입 영역 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 문의하기 모달 -->
  <div id="inquiryModal" class="fixed inset-0 bg-black/70 z-50 hidden flex justify-center items-center p-4 backdrop-blur-sm">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-5 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-paper-plane"></i>
      </div>
      <div>
        <h3 class="text-base font-bold text-slate-900 dark:text-white">상세페이지 제작 및 기획 문의</h3>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">프로젝트 의뢰 및 협업 문의는 아래로 연락주세요.</p>
      </div>
      <div class="bg-slate-50 dark:bg-slate-700/50 p-3 rounded-xl text-xs space-y-1.5 text-left border border-slate-100 dark:border-slate-700">
        <p class="text-slate-600 dark:text-slate-300"><strong>이메일:</strong> contact@example.com</p>
        <p class="text-slate-600 dark:text-slate-300"><strong>카카오톡:</strong> @portfolio_inquiry</p>
      </div>
      <button onclick="closeInquiryModal()" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition">닫기</button>
    </div>
  </div>

  <script>
    let portfolios = [];
    let savedIds = JSON.parse(localStorage.getItem('savedPortfolios') || '[]');
    let currentCategory = '전체';
    let currentTab = 'all'; // 'all' or 'saved'
    let isExpandedView = false;

    // JSON 데이터 가져오기
    async function fetchPortfolioData() {
      const container = document.getElementById('portfolioList');
      container.innerHTML = `
        <div class="text-center py-16 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2 text-blue-500"></i>
          <p class="text-xs">data.json 불러오는 중...</p>
        </div>`;

      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json 파일 로드 실패');
        portfolios = await response.json();
        
        setupCategories();
        updateSavedBadge();
        renderPortfolios();
      } catch (error) {
        container.innerHTML = `
          <div class="text-center py-12 px-4 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">data.json 연동 오류</p>
            <p class="text-[11px] text-slate-400 mt-1">${error.message}</p>
          </div>`;
      }
    }

    // 카테고리 탭 생성
    function setupCategories() {
      const categorySet = new Set(portfolios.map(p => p.category).filter(Boolean));
      const categoryTabs = document.getElementById('categoryTabs');
      
      let html = `<button onclick="selectCategory('전체')" class="category-btn ${currentCategory === '전체' ? 'active bg-blue-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'} px-3 py-1.5 rounded-xl transition">전체</button>`;
      
      categorySet.forEach(cat => {
        const isActive = currentCategory === cat;
        html += `<button onclick="selectCategory('${cat}')" class="category-btn ${isActive ? 'active bg-blue-600 text-white font-semibold' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'} px-3 py-1.5 rounded-xl transition">${cat}</button>`;
      });

      categoryTabs.innerHTML = html;
    }

    // 카테고리 선택
    function selectCategory(category) {
      currentCategory = category;
      setupCategories();
      renderPortfolios();
    }

    // 포트폴리오 카드 렌더링
    function renderPortfolios() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('portfolioList');

      let targetList = portfolios;
      if (currentTab === 'saved') {
        targetList = portfolios.filter(p => savedIds.includes(p.id));
      }

      const filtered = targetList.filter(item => {
        const matchesCategory = currentCategory === '전체' || item.category === currentCategory;
        const matchesSearch = !searchKeyword || 
          (item.title && item.title.toLowerCase().includes(searchKeyword)) ||
          (item.client && item.client.toLowerCase().includes(searchKeyword)) ||
          (item.tags && item.tags.toLowerCase().includes(searchKeyword));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-xs">${currentTab === 'saved' ? '보관함에 담긴 항목이 없습니다.' : '해당 조건의 포트폴리오가 없습니다.'}</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isSaved = savedIds.includes(item.id);
        return `
        <div onclick="openModal(${item.id})" class="bg-white dark:bg-slate-800 rounded-2xl p-3 border border-slate-100 dark:border-slate-700/60 shadow-sm hover:shadow-md transition cursor-pointer flex space-x-3 items-center group relative overflow-hidden">
          <div class="w-20 h-20 rounded-xl overflow-hidden bg-slate-100 dark:bg-slate-700 flex-shrink-0 relative">
            <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/150?text=No+Image'">
            <span class="absolute top-1 left-1 text-[9px] font-bold text-blue-600 dark:text-blue-400 bg-white/90 dark:bg-slate-800/90 px-1.5 py-0.5 rounded-md shadow-sm">${item.category || '기타'}</span>
          </div>
          <div class="flex-1 min-w-0 pr-6">
            <div class="text-[10px] text-slate-400 truncate">${item.client || ''}</div>
            <h3 class="text-xs font-bold text-slate-900 dark:text-slate-100 truncate leading-snug mt-0.5">${item.title}</h3>
            <p class="text-[11px] text-slate-500 dark:text-slate-400 truncate mt-0.5">${item.summary || ''}</p>
            <div class="flex flex-wrap gap-1 mt-1.5">
              ${(item.tags || '').split(',').slice(0, 2).map(tag => `<span class="text-[9px] bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 px-1.5 py-0.5 rounded-md">#${tag.trim()}</span>`).join('')}
            </div>
          </div>
          <button onclick="event.stopPropagation(); toggleBookmark(${item.id})" class="absolute right-3 top-3 text-slate-300 dark:text-slate-600 hover:text-amber-500 dark:hover:text-amber-400 transition">
            <i class="${isSaved ? 'fa-solid text-amber-500 dark:text-amber-400' : 'fa-regular'} fa-bookmark text-sm"></i>
          </button>
        </div>
      `}).join('');
    }

    // 하단 탭 전환 (전체 vs 보관함)
    function switchTab(tab) {
      currentTab = tab;
      const navAll = document.getElementById('navAll');
      const navSaved = document.getElementById('navSaved');

      if (tab === 'all') {
        navAll.className = "flex flex-col items-center text-blue-600 font-semibold";
        navSaved.className = "flex flex-col items-center hover:text-slate-600 dark:hover:text-slate-200 transition relative";
      } else {
        navSaved.className = "flex flex-col items-center text-blue-600 font-semibold relative";
        navAll.className = "flex flex-col items-center hover:text-slate-600 dark:hover:text-slate-200 transition";
      }
      renderPortfolios();
    }

    // 북마크 토글
    function toggleBookmark(id) {
      if (savedIds.includes(id)) {
        savedIds = savedIds.filter(savedId => savedId !== id);
      } else {
        savedIds.push(id);
      }
      localStorage.setItem('savedPortfolios', JSON.stringify(savedIds));
      updateSavedBadge();
      renderPortfolios();

      // 모달 내부 상태 동기화
      const modalBtn = document.getElementById('modalBookmarkBtn');
      if (modalBtn) {
        const isSaved = savedIds.includes(id);
        modalBtn.innerHTML = `<i class="${isSaved ? 'fa-solid text-amber-500' : 'fa-regular'} fa-bookmark text-sm"></i>`;
        modalBtn.onclick = () => toggleBookmark(id);
      }
    }

    function updateSavedBadge() {
      const badge = document.getElementById('savedBadge');
      if (savedIds.length > 0) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // 모달 열기
    function openModal(id) {
      const item = portfolios.find(p => p.id === id);
      if (!item) return;

      document.getElementById('modalCategory').innerText = item.category || '카테고리';
      document.getElementById('modalTitle').innerText = item.title || '';
      document.getElementById('modalClient').innerText = item.client ? `클라이언트: ${item.client}` : '';
      document.getElementById('modalSummary').innerText = item.summary || '설명 없음';

      if (item.intent) {
        document.getElementById('modalIntentBox').classList.remove('hidden');
        document.getElementById('modalIntent').innerText = item.intent;
      } else {
        document.getElementById('modalIntentBox').classList.add('hidden');
      }

      // 북마크 버튼 설정
      const isSaved = savedIds.includes(id);
      const modalBtn = document.getElementById('modalBookmarkBtn');
      modalBtn.innerHTML = `<i class="${isSaved ? 'fa-solid text-amber-500' : 'fa-regular'} fa-bookmark text-sm"></i>`;
      modalBtn.onclick = () => toggleBookmark(id);

      // 태그 출력
      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = (item.tags || '').split(',').map(tag => `<span class="text-[9px] bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 px-1.5 py-0.5 rounded-md">#${tag.trim()}</span>`).join('');

      // 상세 이미지 출력
      const detailImagesContainer = document.getElementById('modalDetailImages');
      const imageUrls = (item.detail_image || '').split(',').map(url => url.trim()).filter(Boolean);

      if (imageUrls.length > 0) {
        detailImagesContainer.innerHTML = imageUrls.map(url => `
          <img src="${url}" class="w-full h-auto block" alt="상세페이지 이미지" onerror="this.src='https://via.placeholder.com/600x1200?text=Detail+Image+Error'">
        `).join('');
      } else {
        detailImagesContainer.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">상세 이미지가 없습니다.</div>`;
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    function openInquiryModal() {
      document.getElementById('inquiryModal').classList.remove('hidden');
    }

    function closeInquiryModal() {
      document.getElementById('inquiryModal').classList.add('hidden');
    }

    // 다크모드 토글
    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const themeIcon = document.getElementById('themeIcon');
      if (document.documentElement.classList.contains('dark')) {
        themeIcon.className = "fa-solid fa-sun text-xs text-amber-400";
      } else {
        themeIcon.className = "fa-solid fa-moon text-xs";
      }
    }

    // 데스크톱화면 넓게보기 / 프레임보기 토글
    function toggleViewMode() {
      const container = document.getElementById('appContainer');
      const icon = document.getElementById('frameIcon');
      isExpandedView = !isExpandedView;

      if (isExpandedView) {
        container.classList.remove('max-w-md', 'md:rounded-[36px]', 'md:border-8');
        container.classList.add('max-w-4xl', 'md:rounded-2xl', 'md:border');
        icon.className = "fa-solid fa-compress text-xs";
      } else {
        container.classList.remove('max-w-4xl', 'md:rounded-2xl', 'md:border');
        container.classList.add('max-w-md', 'md:rounded-[36px]', 'md:border-8');
        icon.className = "fa-solid fa-expand text-xs";
      }
    }

    function filterPortfolios() {
      renderPortfolios();
    }

    window.onload = fetchPortfolioData;
  </script>
</body>
</html>
