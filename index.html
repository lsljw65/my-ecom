<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 & 영상 포트폴리오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="shortcut icon" href="./favicon.png" type="image/x-icon">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }

      to { transform: translateY(0); }

    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200 pb-24">

  <!-- 메인 레이아웃 컨테이너 -->
  <div class="max-w-6xl mx-auto px-4 py-4 md:py-6 space-y-4">

    <!-- 1. 상단 헤더 영역 -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-full  text-white font-black text-sm flex items-center justify-center shadow-md shadow-brand-600/20">

        </div>

          <h1 class="text-base md:text-lg font-bold text-slate-900 dark:text-white leading-tight">상세페이지 포트폴리오</h1>
          <p class="text-xs text-slate-400 font-medium mt-0.5">고전환 커머스 기획 & 디자인 & 영상</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <button onclick="toggleSearchInput()" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
        <button onclick="switchTab('saved')" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition relative">

          <span id="savedBadge" class="hidden absolute top-1.5 right-1.5 w-4 h-4 bg-brand-600 text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
        </button>
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
          <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </header>

    <!-- 검색창 (토글) -->
    <div id="searchBox" class="hidden">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="filterPortfolios()" placeholder="클라이언트, 제목, 태그 검색..."

      </div>
    </div>

    <!-- 2. 상단 카테고리 칩 영역 -->
    <section class="space-y-2">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-400">카테고리</span>
        <span id="totalCount" class="font-bold text-brand-600">총 0개 작업물</span>
      </div>

      <div class="overflow-x-auto no-scrollbar py-0.5">
        <div id="categoryTabs" class="flex space-x-2 whitespace-nowrap text-xs font-semibold">
          <button onclick="selectCategory('전체')" class="category-btn active px-4 py-2 rounded-full bg-brand-600 text-white transition shadow-sm">전체</button>
        </div>

    </section>

    <!-- 3. 서브 타이틀 & 정렬 옵션 -->

        <select id="sortSelect" onchange="filterPortfolios()" class="bg-transparent text-slate-600 dark:text-slate-400 font-semibold focus:outline-none cursor-pointer">

          <option value="oldest">오래된순 정렬 ∨</option>
        </select>
      </div>
    </div>

    <!-- 4. 메인 콘텐츠 분할 영역 (좌측 세로 메뉴 + 우측 그리드) -->

        </div>
        <div id="sideMenuContainer" class="space-y-1">

        </div>
      </aside>

      <!-- 우측 포트폴리오 카드 그리드 -->
      <main class="flex-1 min-w-0">
        <div id="portfolioList" class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">

    </div>

  </div>

  <!-- 5. 하단 고정 네비게이션 바 (푸터) -->

  <!-- 상세페이지 / 영상 플레이어 모달 레이어 -->
  <div id="detailModal" class="fixed inset-0 bg-black/70 z-50 hidden flex justify-center items-end md:items-center p-0 md:p-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white dark:bg-slate-800 w-full max-w-2xl h-[92vh] md:h-[88vh] rounded-t-3xl md:rounded-3xl flex flex-col overflow-hidden shadow-2xl animate-slide-up">
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white/90 dark:bg-slate-800/90 backdrop-blur-md sticky top-0 z-10">
        <div class="pr-2 min-w-0">
          <span id="modalCategory" class="text-[11px] bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 px-2.5 py-0.5 rounded-full font-bold">카테고리</span>
          <h2 id="modalTitle" class="text-base md:text-lg font-bold text-slate-900 dark:text-white mt-1 truncate">제목</h2>
          <p id="modalClient" class="text-xs text-slate-400 truncate">클라이언트명</p>
        </div>
        <div class="flex items-center space-x-2 flex-shrink-0">
          <button id="modalBookmarkBtn" onclick="" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
            <i class="fa-regular fa-bookmark text-sm"></i>
          </button>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-5 no-scrollbar">
        <!-- 영상(비디오) 삽입 영역 (비디오 데이터가 있을 때만 노출) -->
        <div id="modalVideoArea" class="hidden space-y-2">
          <div class="flex items-center space-x-1.5 text-xs font-bold text-brand-600">
            <i class="fa-solid fa-circle-play"></i>
            <span>영상 포트폴리오</span>
          </div>
          <div id="videoContainer" class="w-full aspect-video rounded-2xl overflow-hidden bg-black border border-slate-700 shadow-md">
            <!-- iframe 또는 video 삽입 -->
          </div>
        </div>

        <!-- 기획 요약 카드 -->
        <div class="bg-slate-50 dark:bg-slate-700/40 p-4 rounded-2xl border border-slate-100 dark:border-slate-700/60 text-xs space-y-2.5">
          <div>
            <span class="font-bold text-slate-800 dark:text-slate-200 text-xs">📌 기획 요약</span>
            <p id="modalSummary" class="text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">요약 내용</p>
          </div>
          <div id="modalIntentBox" class="hidden pt-2 border-t border-slate-200/60 dark:border-slate-600">
            <span class="font-bold text-slate-800 dark:text-slate-200 text-xs">🎯 기획 전략 및 의도</span>
            <p id="modalIntent" class="text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">기획 의도</p>
          </div>
          <div id="modalTags" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- 상세 이미지 출력 -->
        <div id="modalDetailImageSection" class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Detail View</h3>
            <span class="text-xs text-brand-600 font-medium"><i class="fa-solid fa-arrows-up-down text-[10px] mr-1"></i>세로 스크롤</span>
          </div>
          <div id="modalDetailImages" class="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 문의하기 모달 -->
  <div id="inquiryModal" class="fixed inset-0 bg-black/70 z-50 hidden flex justify-center items-center p-4 backdrop-blur-sm">
  <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-center space-y-4">
    <div class="w-12 h-12 bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
      <i class="fa-solid fa-comment-dots"></i>
    </div>
    <div>
      <h3 class="text-base font-bold text-slate-900 dark:text-white">상세페이지 제작 문의</h3>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">프로젝트 의뢰 및 상담 문의는 아래 채널을 이용해 주세요.</p>

    <div class="bg-slate-50 dark:bg-slate-700/50 p-3.5 rounded-2xl text-xs space-y-2.5 text-left border border-slate-100 dark:border-slate-700">
      <p class="text-slate-600 dark:text-slate-300 flex justify-between items-center">
        <span><strong>이메일:</strong> lsljw65@gmail.com</span>
      </p>
      <div class="pt-2 border-t border-slate-200/60 dark:border-slate-600 flex flex-col gap-2">
        <!-- 숨고 1:1 상담 버튼 -->
        <a href="https://soomgo.com/profile/users/7014087" target="_blank" class="w-full py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold text-center rounded-xl transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-paper-plane text-xs"></i> 숨고 1:1 견적/상담하기
        </a>
        <!-- 구글 폼 의뢰 작성 버튼 
        <a href="https://forms.gle/구글폼주소" target="_blank" class="w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-center rounded-xl transition flex items-center justify-center gap-1.5">

  <script>
    let portfolios = [];
    let savedIds = JSON.parse(localStorage.getItem('savedPortfolios') || '[]');
    let currentCategory = '전체';
    let currentTab = 'all';

    // 대표 사이드바 메뉴 정의 (영상 메뉴 포함)
    const sideCategories = ['전체', '뷰티', '가구', '전자기기', '패션의류', 'FOOD', '🎬 영상/비디오'];

    function getCategoryEmoji(cat) {
      if (!cat) return '📁';
      if (cat.includes('식품') || cat.includes('농산') || cat.includes('FOOD')) return '🌾';
      if (cat.includes('뷰티') || cat.includes('디퓨저') || cat.includes('화장품')) return '✨';
      if (cat.includes('패션') || cat.includes('잡화') || cat.includes('의류')) return '🍇';
      if (cat.includes('리빙') || cat.includes('가구') || cat.includes('인테리어')) return '🏡';
      if (cat.includes('전자') || cat.includes('IT')) return '💻';
      if (cat.includes('영상') || cat.includes('비디오')) return '🎬';
      return '📦';
    }

    async function fetchPortfolioData() {
      const container = document.getElementById('portfolioList');
      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json 로드 실패 (상태: ' + response.status + ')');
        portfolios = await response.json();
        
        setupCategories();
        setupSideMenu();
        updateSavedBadge();
        renderPortfolios();
      } catch (error) {
        console.error("데이터 연동 오류:", error);
        container.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">data.json 연동 오류</p>
            <p class="text-[11px] text-slate-400 mt-1">${error.message}</p>
          </div>`;
      }
    }

    // 상단 가로 칩 메뉴
    function setupCategories() {
      const categorySet = new Set(portfolios.map(p => p.category).filter(Boolean));
      const categoryTabs = document.getElementById('categoryTabs');
      
      let html = `
        <button onclick="selectCategory('전체')" class="category-btn ${currentCategory === '전체' ? 'active bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'} px-4 py-2 rounded-full transition">
          전체
        </button>`;
      
      categorySet.forEach(cat => {
        const isActive = currentCategory === cat;
        const emoji = getCategoryEmoji(cat);
        html += `
          <button onclick="selectCategory('${cat}')" class="category-btn ${isActive ? 'active bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'} px-4 py-2 rounded-full transition flex items-center space-x-1.5">
            <span>${emoji}</span>
            <span>${cat}</span>
          </button>`;
      });

      categoryTabs.innerHTML = html;
    }

    // 좌측 세로 사이드바 메뉴 생성
    function setupSideMenu() {
      const sideMenuContainer = document.getElementById('sideMenuContainer');
      sideMenuContainer.innerHTML = sideCategories.map(cat => {
        const cleanCat = cat.replace('🎬 ', '');
        const isActive = currentCategory === cleanCat || (currentCategory === '전체' && cleanCat === '전체');
        return `
          <button onclick="selectCategory('${cleanCat}')" class="w-full text-left px-3 py-2.5 rounded-xl transition font-medium flex items-center justify-between ${isActive ? 'bg-slate-300 dark:bg-slate-700 text-slate-900 dark:text-white font-bold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700/50'}">
            <span class="truncate">${cat}</span>
          </button>
        `;
      }).join('');
    }

    function selectCategory(category) {
      currentCategory = category;
      currentTab = 'all';
      document.getElementById('currentCategoryTitle').innerText = category === '전체' ? '전체 포트폴리오' : `${category} 포트폴리오`;
      updateNavStyle('all');
      setupCategories();
      setupSideMenu();
      renderPortfolios();
    }

    function renderPortfolios() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const sortValue = document.getElementById('sortSelect').value;
      const container = document.getElementById('portfolioList');

      let targetList = portfolios;
      if (currentTab === 'saved') {
        targetList = portfolios.filter(p => savedIds.includes(p.id));
        document.getElementById('currentCategoryTitle').innerText = '보관함 목록';
      }

      let filtered = targetList.filter(item => {
        const matchesCategory = currentCategory === '전체' || currentTab === 'saved' || (item.category && item.category.includes(currentCategory));
        const matchesSearch = !searchKeyword || 
          (item.title && item.title.toLowerCase().includes(searchKeyword)) ||
          (item.client && item.client.toLowerCase().includes(searchKeyword)) ||
          (item.tags && item.tags.toLowerCase().includes(searchKeyword));
        return matchesCategory && matchesSearch;
      });

      if (sortValue === 'latest') {
        filtered.sort((a, b) => b.id - a.id);
      } else {
        filtered.sort((a, b) => a.id - b.id);
      }

      document.getElementById('totalCount').innerText = `총 ${filtered.length}개 작업물`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20 text-slate-400">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-xs">${currentTab === 'saved' ? '보관함에 담긴 작업물이 없습니다.' : '등록된 포트폴리오가 없습니다.'}</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isSaved = savedIds.includes(item.id);
        const toolsText = item.tools || 'Photoshop, Figma';
        const isVideo = item.video_url || (item.category && item.category.includes('영상'));

        return `
        <div onclick="openModal(${item.id})" class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-800 shadow-sm hover:shadow-xl transition duration-300 cursor-pointer overflow-hidden group flex flex-col justify-between">
          <div class="relative h-48 md:h-52 w-full overflow-hidden bg-slate-900">
            <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500 opacity-90" onerror="this.src='https://via.placeholder.com/600x400?text=No+Image'">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/30 to-black/20"></div>

            <div class="absolute top-3.5 left-3.5 right-3.5 flex items-center justify-between z-10">
              <span class="text-[11px] font-bold text-white bg-black/40 backdrop-blur-md px-3 py-1 rounded-full border border-white/20 flex items-center gap-1">
                ${isVideo ? '<i class="fa-solid fa-play text-[9px] text-brand-500"></i> VIDEO' : (item.category || '기타')}
              </span>
              <button onclick="event.stopPropagation(); toggleBookmark(${item.id})" class="w-8 h-8 rounded-full bg-black/30 backdrop-blur-md text-white/80 hover:text-white hover:bg-black/50 flex items-center justify-center transition">
                <i class="${isSaved ? 'fa-solid text-brand-500' : 'fa-regular'} fa-heart text-xs"></i>
              </button>
            </div>

            <div class="absolute bottom-4 left-4 right-4 z-10 text-white">
              <div class="text-[11px] font-semibold text-white/70 uppercase tracking-wider truncate mb-0.5">${item.client || ''}</div>
              <h3 class="text-base font-bold leading-snug truncate drop-shadow-sm">${item.title}</h3>
            </div>
          </div>

          <div class="p-4 md:p-5 flex-1 flex flex-col justify-between space-y-3">
            <p class="text-xs text-slate-600 dark:text-slate-300 line-clamp-2 leading-relaxed">
              ${item.summary || ''}
            </p>

            <div class="flex flex-wrap gap-1.5 pt-1">
              ${(item.tags || '').split(',').map(tag => `<span class="text-[10px] bg-slate-100 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 px-2 py-0.5 rounded-md font-medium">#${tag.trim()}</span>`).join('')}
            </div>

            <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[11px]">
              <div class="flex items-center space-x-1.5 text-slate-400">
                <i class="fa-solid fa-paperclip text-[10px]"></i>
                <span class="truncate max-w-[130px]">${toolsText}</span>
              </div>
              <span class="font-bold text-brand-600 dark:text-brand-400 group-hover:translate-x-1 transition duration-200 flex items-center gap-1">
                ${isVideo ? '영상 보기' : '상세 보기'} <i class="fa-solid fa-chevron-right text-[9px]"></i>
              </span>
            </div>
          </div>
        </div>
      `}).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      updateNavStyle(tab);
      renderPortfolios();
    }

    function updateNavStyle(tab) {
      const navAll = document.getElementById('navAll');
      const navSaved = document.getElementById('navSaved');

      if (tab === 'all') {
        navAll.className = "flex flex-col items-center text-brand-600 font-bold space-y-1 transition";
        navSaved.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 space-y-1 transition relative";
      } else {
        navSaved.className = "flex flex-col items-center text-brand-600 font-bold space-y-1 transition relative";
        navAll.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 space-y-1 transition";
      }
    }

    function toggleBookmark(id) {
      if (savedIds.includes(id)) {
        savedIds = savedIds.filter(savedId => savedId !== id);
      } else {
        savedIds.push(id);
      }
      localStorage.setItem('savedPortfolios', JSON.stringify(savedIds));
      updateSavedBadge();
      renderPortfolios();

      const modalBtn = document.getElementById('modalBookmarkBtn');
      if (modalBtn) {
        const isSaved = savedIds.includes(id);
        modalBtn.innerHTML = `<i class="${isSaved ? 'fa-solid text-brand-600' : 'fa-regular'} fa-bookmark text-sm"></i>`;
        modalBtn.onclick = () => toggleBookmark(id);
      }
    }

    function updateSavedBadge() {
      const badge = document.getElementById('savedBadge');
      if (savedIds.length > 0) {
        badge.innerText = savedIds.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // 모달 처리 (영상 / 이미지 통합)
    function openModal(id) {
      const item = portfolios.find(p => p.id === id);
      if (!item) return;

      document.getElementById('modalCategory').innerText = item.category || '카테고리';
      document.getElementById('modalTitle').innerText = item.title || '';
      document.getElementById('modalClient').innerText = item.client ? `클라이언트: ${item.client}` : '';
      document.getElementById('modalSummary').innerText = item.summary || '설명 없음';

      if (item.intent) {
        document.getElementById('modalIntentBox').classList.remove('hidden');
        document.getElementById('modalIntent').innerText = item.intent;
      } else {
        document.getElementById('modalIntentBox').classList.add('hidden');
      }

      // 동영상 처리 (video_url 속성이 있는 경우)
      const modalVideoArea = document.getElementById('modalVideoArea');
      const videoContainer = document.getElementById('videoContainer');
      
      if (item.video_url) {
        modalVideoArea.classList.remove('hidden');
        let videoEmbedHtml = '';
        if (item.video_url.includes('youtube.com') || item.video_url.includes('youtu.be')) {
          let embedUrl = item.video_url.replace('watch?v=', 'embed/').replace('youtu.be/', 'youtube.com/embed/');
          videoEmbedHtml = `<iframe src="${embedUrl}?autoplay=1&rel=0" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
        } else {
          videoEmbedHtml = `<video src="${item.video_url}" controls autoplay class="w-full h-full object-contain"></video>`;
        }
        videoContainer.innerHTML = videoEmbedHtml;
      } else {
        modalVideoArea.classList.add('hidden');
        videoContainer.innerHTML = '';
      }

      const isSaved = savedIds.includes(id);
      const modalBtn = document.getElementById('modalBookmarkBtn');
      modalBtn.innerHTML = `<i class="${isSaved ? 'fa-solid text-brand-600' : 'fa-regular'} fa-bookmark text-sm"></i>`;
      modalBtn.onclick = () => toggleBookmark(id);

      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = (item.tags || '').split(',').map(tag => `<span class="text-[10px] bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-600 px-2 py-0.5 rounded-md">#${tag.trim()}</span>`).join('');

      // 상세 이미지 처리
      const detailImageSection = document.getElementById('modalDetailImageSection');
      const detailImagesContainer = document.getElementById('modalDetailImages');
      const imageUrls = (item.detail_image || '').split(',').map(url => url.trim()).filter(Boolean);

      if (imageUrls.length > 0) {
        detailImageSection.classList.remove('hidden');
        detailImagesContainer.innerHTML = imageUrls.map(url => `
          <img src="${url}" class="w-full h-auto block" alt="상세페이지 이미지" onerror="this.src='https://via.placeholder.com/600x1200?text=Detail+Image+Error'">
        `).join('');
      } else {
        if (!item.video_url) {
          detailImageSection.classList.remove('hidden');
          detailImagesContainer.innerHTML = `<div class="p-8 text-center text-xs text-slate-400">상세 이미지가 없습니다.</div>`;
        } else {
          detailImageSection.classList.add('hidden');
        }
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('videoContainer').innerHTML = ''; // 모달 닫을 때 동영상 재생 중지
    }

    function openInquiryModal() {
      document.getElementById('inquiryModal').classList.remove('hidden');
    }

    function closeInquiryModal() {
      document.getElementById('inquiryModal').classList.add('hidden');
    }

    function toggleSearchInput() {
      const searchBox = document.getElementById('searchBox');
      searchBox.classList.toggle('hidden');
      if (!searchBox.classList.contains('hidden')) {
        document.getElementById('searchInput').focus();
      }
    }

    function filterPortfolios() {
      renderPortfolios();
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');
      const themeIcon = document.getElementById('themeIcon');
      if (document.documentElement.classList.contains('dark')) {
        themeIcon.className = "fa-solid fa-sun text-sm text-amber-400";
      } else {
        themeIcon.className = "fa-solid fa-moon text-sm";
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', fetchPortfolioData);
    } else {
      fetchPortfolioData();
    }
  </script>
</body>
</html>
