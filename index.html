<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 포트폴리오 갤러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">

  <!-- 전체 컨테이너 (데스크톱에서는 max-w-6xl로 넓게 확장) -->
  <div class="max-w-6xl mx-auto min-h-screen flex flex-col bg-white shadow-sm border-x border-gray-100">
    
    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-gray-100 px-4 md:px-8 py-4 flex items-center justify-between sticky top-0 z-20">
      <div>
        <h1 class="text-xl font-bold text-gray-900 tracking-tight">Portfolio Gallery</h1>
        <p class="text-xs text-gray-500 mt-0.5">상세페이지 기획 & 디자인 포트폴리오</p>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="fetchPortfolioData()" class="px-3 py-1.5 text-xs font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate"></i>
          <span>새로고침</span>
        </button>
      </div>
    </header>

    <!-- 검색창 & 카테고리 탭 영역 -->
    <div class="px-4 md:px-8 pt-4 pb-3 bg-white border-b border-gray-100 space-y-3">
      <!-- 검색창 -->
      <div class="relative max-w-md">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterPortfolios()" placeholder="클라이언트, 제목, 태그 검색..." 
               class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition">
      </div>

      <!-- 카테고리 탭 -->
      <div class="overflow-x-auto no-scrollbar py-1">
        <div id="categoryTabs" class="flex space-x-2 whitespace-nowrap text-xs font-medium">
          <button onclick="selectCategory('전체')" class="category-btn active px-4 py-2 rounded-full bg-blue-600 text-white transition">전체</button>
        </div>
      </div>
    </div>

    <!-- 포트폴리오 카드 그리드 (데스크톱: 3열, 태블릿: 2열, 모바일: 1열) -->
    <main class="flex-1 p-4 md:p-8">
      <div id="portfolioList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
        <!-- 로딩 상태 -->
        <div id="loadingState" class="col-span-full text-center py-20 text-gray-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
          <p class="text-sm">data.json 데이터를 불러오는 중...</p>
        </div>
      </div>
    </main>

    <!-- 하단 푸터 -->
    <footer class="bg-white border-t border-gray-100 px-6 py-4 text-center text-xs text-gray-400">
      <p>© Portfolio Gallery. Powered by GitHub Pages.</p>
    </footer>

  </div>

  <!-- 상세페이지 모달 레이어 (데스크톱에 최적화된 대형 팝업) -->
  <div id="detailModal" class="fixed inset-0 bg-black/60 z-50 hidden flex justify-center items-center p-2 md:p-6 backdrop-blur-sm transition-opacity">
    <div class="bg-white w-full max-w-2xl h-[90vh] rounded-2xl flex flex-col overflow-hidden shadow-2xl animate-slide-up">
      <!-- 모달 헤더 -->
      <div class="px-5 py-4 border-b border-gray-100 flex items-center justify-between bg-white sticky top-0 z-10">
        <div>
          <span id="modalCategory" class="text-[11px] bg-blue-50 text-blue-600 px-2.5 py-0.5 rounded-full font-bold">카테고리</span>
          <h2 id="modalTitle" class="text-lg font-bold text-gray-900 mt-1 leading-snug">제목</h2>
          <p id="modalClient" class="text-xs text-gray-400">클라이언트명</p>
        </div>
        <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 모달 본문 (스크롤) -->
      <div class="flex-1 overflow-y-auto p-5 space-y-5 no-scrollbar">
        <!-- 기획의도 요약 카드 -->
        <div class="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-xs space-y-2.5">
          <div>
            <span class="font-bold text-gray-800 text-sm">📌 기획 포인트</span>
            <p id="modalSummary" class="text-gray-600 mt-1 leading-relaxed">요약 내용</p>
          </div>
          <div id="modalIntentBox" class="hidden pt-2 border-t border-gray-200/60">
            <span class="font-bold text-gray-800 text-sm">🎯 전략 방향</span>
            <p id="modalIntent" class="text-gray-600 mt-1 leading-relaxed">기획 의도</p>
          </div>
          <div id="modalTags" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- 상세페이지 이미지 출력 영역 -->
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-gray-400 px-1">상세페이지 이미지 (Full View)</h3>
          <div id="modalDetailImages" class="space-y-0 rounded-xl overflow-hidden border border-gray-200 bg-gray-100">
            <!-- 이미지들이 연속으로 삽입됨 -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let portfolios = [];
    let currentCategory = '전체';

    // JSON 데이터 가져오기
    async function fetchPortfolioData() {
      const container = document.getElementById('portfolioList');
      container.innerHTML = `
        <div class="col-span-full text-center py-20 text-gray-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-blue-500"></i>
          <p class="text-sm">data.json 데이터를 불러오는 중...</p>
        </div>`;

      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json 파일을 찾을 수 없습니다.');
        portfolios = await response.json();
        
        setupCategories();
        renderPortfolios();
      } catch (error) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 text-gray-500">
            <i class="fa-solid fa-triangle-exclamation text-4xl text-amber-500 mb-3"></i>
            <p class="text-base font-bold text-gray-800">data.json 연동 오류</p>
            <p class="text-xs text-gray-500 mt-1">${error.message}</p>
            <p class="text-xs text-gray-400 mt-3 bg-gray-50 p-3 rounded-lg inline-block">data.json 파일이 index.html과 동일한 위치에 생성되어 있는지 확인해 주세요.</p>
          </div>`;
      }
    }

    // 카테고리 탭 동적 구성
    function setupCategories() {
      const categorySet = new Set(portfolios.map(p => p.category).filter(Boolean));
      const categoryTabs = document.getElementById('categoryTabs');
      
      let html = `<button onclick="selectCategory('전체')" class="category-btn ${currentCategory === '전체' ? 'active bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-2 rounded-full transition">전체</button>`;
      
      categorySet.forEach(cat => {
        const isActive = currentCategory === cat;
        html += `<button onclick="selectCategory('${cat}')" class="category-btn ${isActive ? 'active bg-blue-600 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'} px-4 py-2 rounded-full transition">${cat}</button>`;
      });

      categoryTabs.innerHTML = html;
    }

    // 카테고리 선택
    function selectCategory(category) {
      currentCategory = category;
      setupCategories();
      renderPortfolios();
    }

    // 카드 목록 출력
    function renderPortfolios() {
      const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('portfolioList');

      const filtered = portfolios.filter(item => {
        const matchesCategory = currentCategory === '전체' || item.category === currentCategory;
        const matchesSearch = !searchKeyword || 
          (item.title && item.title.toLowerCase().includes(searchKeyword)) ||
          (item.client && item.client.toLowerCase().includes(searchKeyword)) ||
          (item.tags && item.tags.toLowerCase().includes(searchKeyword));
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20 text-gray-400">
            <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
            <p class="text-sm">등록된 포트폴리오가 없습니다.</p>
          </div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div onclick="openModal(${item.id})" class="bg-white rounded-2xl p-4 border border-gray-100 shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
          <div>
            <div class="w-full h-48 rounded-xl overflow-hidden bg-gray-100 mb-3 border border-gray-100 relative">
              <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
              <span class="absolute top-2.5 left-2.5 text-[10px] font-bold text-blue-600 bg-white/90 backdrop-blur-sm px-2.5 py-1 rounded-md shadow-sm">${item.category || '기타'}</span>
            </div>
            <div class="text-[11px] text-gray-400 mb-1">${item.client || ''}</div>
            <h3 class="text-base font-bold text-gray-900 group-hover:text-blue-600 transition leading-snug mb-1">${item.title}</h3>
            <p class="text-xs text-gray-500 line-clamp-2 leading-relaxed mb-3">${item.summary || ''}</p>
          </div>
          <div class="flex flex-wrap gap-1.5 pt-2 border-t border-gray-50">
            ${(item.tags || '').split(',').map(tag => `<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-md">#${tag.trim()}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // 실시간 검색
    function filterPortfolios() {
      renderPortfolios();
    }

    // 상세 모달 열기
    function openModal(id) {
      const item = portfolios.find(p => p.id === id);
      if (!item) return;

      document.getElementById('modalCategory').innerText = item.category || '카테고리';
      document.getElementById('modalTitle').innerText = item.title || '';
      document.getElementById('modalClient').innerText = item.client ? `클라이언트: ${item.client}` : '';
      document.getElementById('modalSummary').innerText = item.summary || '설명 없음';

      if (item.intent) {
        document.getElementById('modalIntentBox').classList.remove('hidden');
        document.getElementById('modalIntent').innerText = item.intent;
      } else {
        document.getElementById('modalIntentBox').classList.add('hidden');
      }

      // 태그 출력
      const modalTags = document.getElementById('modalTags');
      modalTags.innerHTML = (item.tags || '').split(',').map(tag => `<span class="text-[11px] bg-white text-gray-600 border border-gray-200 px-2 py-0.5 rounded-md">#${tag.trim()}</span>`).join('');

      // 상세 이미지 목록 출력 (쉼표 구분을 통한 분할 이미지 대응)
      const detailImagesContainer = document.getElementById('modalDetailImages');
      const imageUrls = (item.detail_image || '').split(',').map(url => url.trim()).filter(Boolean);

      if (imageUrls.length > 0) {
        detailImagesContainer.innerHTML = imageUrls.map(url => `
          <img src="${url}" class="w-full h-auto block" alt="상세페이지 이미지" onerror="this.src='https://via.placeholder.com/600x1200?text=Detail+Image+Error'">
        `).join('');
      } else {
        detailImagesContainer.innerHTML = `<div class="p-8 text-center text-xs text-gray-400">상세 이미지가 없습니다.</div>`;
      }

      document.getElementById('detailModal').classList.remove('hidden');
    }

    // 상세 모달 닫기
    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
    }

    // 초기 실행
    window.onload = fetchPortfolioData;
  </script>
</body>
</html>
