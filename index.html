<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상세페이지 포트폴리오</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48', // 메인 레드/로즈 포인트 컬러
              700: '#be123c',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 transition-colors duration-200">

  <!-- 메인 레이아웃 컨테이너 -->
  <div class="max-w-5xl mx-auto px-4 py-4 md:py-8 space-y-6">

    <!-- 1. 상단 헤더 영역 -->
    <header class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
      <div class="flex items-center space-x-3">
        <!-- 원형 로고 배지 -->
        <div class="w-10 h-10 rounded-full bg-brand-600 text-white font-black text-sm flex items-center justify-center shadow-md shadow-brand-600/20">
          CD
        </div>
        <div>
          <h1 class="text-base md:text-lg font-bold text-slate-900 dark:text-white leading-tight">상세페이지 포트폴리오</h1>
          <p class="text-xs text-slate-400 font-medium mt-0.5">고전환 커머스 기획 & 디자인</p>
        </div>
      </div>

      <!-- 우측 유틸리티 버튼 -->
      <div class="flex items-center space-x-2">
        <button onclick="toggleSearchInput()" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
          <i class="fa-solid fa-magnifying-glass text-sm"></i>
        </button>
        <button onclick="switchTab('saved')" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition relative">
          <i class="fa-regular fa-bookmark text-sm"></i>
          <span id="savedBadge" class="hidden absolute top-1.5 right-1.5 w-4 h-4 bg-brand-600 text-white text-[9px] font-bold rounded-full flex items-center justify-center">0</span>
        </button>
        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
          <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
        </button>
      </div>
    </header>

    <!-- 검색창 (토글형) -->
    <div id="searchBox" class="hidden">
      <div class="relative">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input type="text" id="searchInput" oninput="filterPortfolios()" placeholder="클라이언트, 제목, 태그 검색..." 
               class="w-full pl-9 pr-4 py-2.5 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-600/50 shadow-sm transition">
      </div>
    </div>

    <!-- 2. 카테고리 탭 영역 -->
    <section class="space-y-3">
      <div class="flex items-center justify-between text-xs">
        <span class="font-bold text-slate-400">카테고리</span>
        <span id="totalCount" class="font-bold text-brand-600">총 0개 작업물</span>
      </div>

      <!-- 카테고리 칩 목록 (가로 스크롤) -->
      <div class="overflow-x-auto no-scrollbar py-0.5">
        <div id="categoryTabs" class="flex space-x-2 whitespace-nowrap text-xs font-semibold">
          <button onclick="selectCategory('전체')" class="category-btn active px-4 py-2 rounded-full bg-brand-600 text-white transition shadow-sm">전체</button>
        </div>
      </div>
    </section>

    <!-- 3. 리스트 서브 헤더 (정렬 및 현재 필터) -->
    <div class="flex items-center justify-between pt-2 pb-1 border-b border-slate-100 dark:border-slate-800 text-xs text-slate-500">
      <div class="flex items-center space-x-1.5 font-bold text-slate-700 dark:text-slate-300">
        <i class="fa-solid fa-sliders text-slate-400 text-[11px]"></i>
        <span id="currentCategoryTitle">전체 포트폴리오</span>
      </div>
      <div class="flex items-center space-x-1">
        <select id="sortSelect" onchange="filterPortfolios()" class="bg-transparent text-slate-600 dark:text-slate-400 font-semibold focus:outline-none cursor-pointer">
          <option value="latest">최신순 정렬 ∨</option>
          <option value="oldest">오래된순 정렬 ∨</option>
        </select>
      </div>
    </div>

    <!-- 4. 포트폴리오 카드 그리드 (데스크톱 2열) -->
    <main>
      <div id="portfolioList" class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
        <!-- 로딩 표시 -->
        <div id="loadingState" class="col-span-full text-center py-20 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-brand-600"></i>
          <p class="text-xs">포트폴리오 데이터를 불러오는 중...</p>
        </div>
      </div>
    </main>

  </div>

  <!-- 상세페이지 모달 레이어 -->
  <div id="detailModal" class="fixed inset-0 bg-black/70 z-50 hidden flex justify-center items-end md:items-center p-0 md:p-4 backdrop-blur-sm transition-opacity">
    <div class="bg-white dark:bg-slate-800 w-full max-w-2xl h-[92vh] md:h-[88vh] rounded-t-3xl md:rounded-3xl flex flex-col overflow-hidden shadow-2xl animate-slide-up">
      
      <!-- 모달 헤더 -->
      <div class="px-5 py-4 border-b border-slate-100 dark:border-slate-700 flex items-center justify-between bg-white/90 dark:bg-slate-800/90 backdrop-blur-md sticky top-0 z-10">
        <div class="pr-2 min-w-0">
          <span id="modalCategory" class="text-[11px] bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 px-2.5 py-0.5 rounded-full font-bold">카테고리</span>
          <h2 id="modalTitle" class="text-base md:text-lg font-bold text-slate-900 dark:text-white mt-1 truncate">제목</h2>
          <p id="modalClient" class="text-xs text-slate-400 truncate">클라이언트명</p>
        </div>
        <div class="flex items-center space-x-2 flex-shrink-0">
          <button id="modalBookmarkBtn" onclick="" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
            <i class="fa-regular fa-bookmark text-sm"></i>
          </button>
          <button onclick="closeModal()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-base"></i>
          </button>
        </div>
      </div>

      <!-- 모달 본문 스크롤 영역 -->
      <div class="flex-1 overflow-y-auto p-5 space-y-5 no-scrollbar">
        <!-- 기획 요약 카드 -->
        <div class="bg-slate-50 dark:bg-slate-700/40 p-4 rounded-2xl border border-slate-100 dark:border-slate-700/60 text-xs space-y-2.5">
          <div>
            <span class="font-bold text-slate-800 dark:text-slate-200 text-xs">📌 기획 요약</span>
            <p id="modalSummary" class="text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">요약 내용</p>
          </div>
          <div id="modalIntentBox" class="hidden pt-2 border-t border-slate-200/60 dark:border-slate-600">
            <span class="font-bold text-slate-800 dark:text-slate-200 text-xs">🎯 기획 전략 및 의도</span>
            <p id="modalIntent" class="text-slate-600 dark:text-slate-300 mt-1 leading-relaxed">기획 의도</p>
          </div>
          <div id="modalTags" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- 상세 이미지 출력 -->
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Detail View</h3>
            <span class="text-xs text-brand-600 font-medium"><i class="fa-solid fa-arrows-up-down text-[10px] mr-1"></i>세로 스크롤</span>
          </div>
          <div id="modalDetailImages" class="rounded-2xl overflow-hidden border border-slate-200 dark:border-slate-700 bg-slate-100 dark:bg-slate-900">
            <!-- 연속 이미지 삽입 -->
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    let portfolios = [];
    let savedIds = JSON.parse(localStorage.getItem('savedPortfolios') || '[]');
    let currentCategory = '전체';
    let currentTab = 'all';

    // 카테고리별 이모지 매핑
    function getCategoryEmoji(cat) {
      if (!cat) return '📁';
      if (cat.includes('식품') || cat.includes('농산')) return '🌾';
      if (cat.includes('뷰티') || cat.includes('디퓨저') || cat.includes('화장품')) return '✨';
      if (cat.includes('패션') || cat.includes('잡화') || cat.includes('의류')) return '🍇';
      if (cat.includes('리빙') || cat.includes('가구') || cat.includes('인테리어')) return '🏡';
      if (cat.includes('IT') || cat.includes('전자')) return '💻';
      return '📦';
    }

    // JSON 데이터 가져오기
    async function fetchPortfolioData() {
      const container = document.getElementById('portfolioList');
      container.innerHTML = `
        <div class="col-span-full text-center py-20 text-slate-400">
          <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-brand-600"></i>
          <p class="text-xs">data.json 데이터를 불러오는 중...</p>
        </div>`;

      try {
        const response = await fetch('./data.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error('data.json 파일을 찾아올 수 없습니다.');
        portfolios = await response.json();
        
        setupCategories();
        updateSavedBadge();
        renderPortfolios();
      } catch (error) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 text-slate-500 dark:text-slate-400">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-amber-500 mb-2"></i>
            <p class="text-xs font-bold text-slate-800 dark:text-slate-200">data.json 연동 오류</p>
            <p class="text-[11px] text-slate-400 mt-1">${error.message}</p>
          </div>`;
      }
    }

    // 카테고리 탭 생성
    function setupCategories() {
      const categorySet = new Set(portfolios.map(p => p.category).filter(Boolean));
      const categoryTabs = document.getElementById('categoryTabs');
      
      let html = `
        <button onclick="selectCategory('전체')" class="category-btn ${currentCategory === '전체' ? 'active bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'} px-4 py-2 rounded-full transition">
          전체
        </button>`;
      
      categorySet.forEach(cat => {
        const isActive = currentCategory === cat;
        const emoji = getCategoryEmoji(cat);
        html += `
          <button onclick="selectCategory('${cat}')" class="category-btn ${isActive ? 'active bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200'} px-4 py-2 rounded-full transition flex items-center space-x-1.5">
            <span>${emoji}</span>
            <span>${cat}</span>
          </button>`;
      });

      categoryTabs.innerHTML = html;
    }

    // 카테고리 선택
    function selectCategory(category) {
      currentCategory = category;
      currentTab = 'all';
      document.getElementById('currentCategoryTitle').innerText = category === '전체' ? '전체 포트폴리오' : `${category} 포트폴리오`; setupCategories(); renderPortfolios(); }  // 포트폴리오 카드 그리드 출력 function renderPortfolios() { const searchKeyword = document.getElementById('searchInput').value.toLowerCase(); const sortValue = document.getElementById('sortSelect').value; const container = document.getElementById('portfolioList');  let targetList = portfolios; if (currentTab === 'saved') { targetList = portfolios.filter(p => savedIds.includes(p.id)); document.getElementById('currentCategoryTitle').innerText = '보관함 목록'; }  // 카테고리 및 검색어 필터링 let filtered = targetList.filter(item => { const matchesCategory = currentCategory === '전체' \vert{}\vert{} currentTab === 'saved' \vert{}\vert{} item.category === currentCategory; const matchesSearch = !searchKeyword \vert{}\vert{} (item.title && item.title.toLowerCase().includes(searchKeyword)) \vert{}\vert{} (item.client && item.client.toLowerCase().includes(searchKeyword)) \vert{}\vert{} (item.tags && item.tags.toLowerCase().includes(searchKeyword)); return matchesCategory && matchesSearch; });  // 정렬 if (sortValue === 'latest') { filtered.sort((a, b) => b.id - a.id); } else { filtered.sort((a, b) => a.id - b.id); }  // 작업물 개수 업데이트 document.getElementById('totalCount').innerText = `총 ${filtered.length}개 작업물`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-20 text-slate-400">
            <i class="fa-regular fa-folder-open text-3xl mb-2"></i>
            <p class="text-xs">${currentTab === 'saved' ? '보관함에 담긴 작업물이 없습니다.' : '등록된 포트
